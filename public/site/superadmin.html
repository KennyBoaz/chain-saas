<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Super Admin — Chain SaaS</title>
  <link rel="stylesheet" href="/site/style.css">
  <style>
    .dash-container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,.05); }
    th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f9f9f9; font-weight: 600; font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
  <nav>
    <div class="logo">Chain Innovation — Super Admin</div>
    <div class="links">
      <button onclick="logout()" class="btn" style="background: #eee; color: #333;">Log Out</button>
    </div>
  </nav>

  <div class="dash-container">
    <h1>Tenants</h1>
    <p style="color: var(--muted); margin-bottom: 20px;">Manage all businesses on the platform.</p>
    
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Business</th>
          <th>Status</th>
          <th>Expiry</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tenant-rows"></tbody>
    </table>
  </div>

  <script>
    let csrf = localStorage.getItem('csrf');

    async function loadTenants() {
      const res = await fetch('/chain-saas/api/platform/tenants', { headers: { 'X-CSRF-Token': csrf } });
      if (res.status === 401 || res.status === 403) {
        alert('You must be logged in as a Super Admin. Redirecting to login...');
        return window.location.href = '/site/login.html';
      }
      
      const data = await res.json();
      const tbody = document.getElementById('tenant-rows');
      tbody.innerHTML = '';
      
      data.tenants.forEach(t => {
        tbody.innerHTML += `
          <tr>
            <td>#${t.id}</td>
            <td><strong>${t.business_name}</strong><br><small>${t.slug}</small></td>
            <td><span class="status-badge status-${t.status}">${t.status}</span></td>
            <td>${t.current_period_end ? new Date(t.current_period_end).toLocaleDateString() : 'None'}</td>
            <td>
              ${t.status !== 'active' ? `<button class="btn" onclick="markPaid(${t.id})" style="padding: 5px 10px; font-size: 12px;">Mark Cash Paid</button>` : ''}
            </td>
          </tr>
        `;
      });
    }

    async function markPaid(tenantId) {
      if (!confirm('Mark this tenant as paid (Cash)? This will activate their subscription.')) return;
      
      const res = await fetch('/chain-saas/api/platform/tenants/' + tenantId + '/mark-paid', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf },
        body: JSON.stringify({ planId: 1, note: "Cash payment received" })
      });
      
      if (res.ok) {
        alert('Tenant activated!');
        loadTenants();
      } else {
        alert('Failed.');
      }
    }

    async function logout() {
      await fetch('/chain-saas/api/auth/logout', { method: 'POST', headers: { 'X-CSRF-Token': csrf } });
      localStorage.removeItem('csrf');
      window.location.href = '/site/index.html';
    }

    loadTenants();
  </script>
</body>
</html>
