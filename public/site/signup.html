<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Chain SaaS</title>
  <link rel="stylesheet" href="/chain-saas/site/style.css">
  <style>
    .auth-container { max-width: 480px; margin: 60px auto; background: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.1); }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 14px; }
    input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 14px; }
    .error { color: red; font-size: 14px; margin-bottom: 15px; display: none; }
  </style>
</head>
<body>
  <nav>
    <div class="logo"><a href="/chain-saas/site/index.html" style="text-decoration:none; color:inherit;">Chain Innovation</a></div>
  </nav>

  <div class="auth-container">
    <h2>Create your account</h2>
    <p style="color:var(--muted); margin-bottom: 30px;">Start automating your WhatsApp today.</p>
    
    <div class="error" id="err"></div>

    <form id="signup-form">
      <div class="form-group">
        <label>Business Name</label>
        <input type="text" id="businessName" required placeholder="e.g. Kadosh Energies">
      </div>
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" id="name" required placeholder="e.g. Jabel">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="you@company.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required minlength="8" placeholder="At least 8 characters">
      </div>
      
      <div class="checkbox-group">
        <input type="checkbox" id="terms" required>
        <label for="terms" style="font-weight:normal; margin:0; cursor:pointer;">I agree to the Terms of Service and Privacy Policy.</label>
      </div>

      <button type="submit" class="btn btn-large" style="width:100%;">Create Account</button>
    </form>
  </div>

  <script>
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      const err = document.getElementById('err');
      err.style.display = 'none';
      btn.textContent = 'Creating...';
      btn.disabled = true;

      const payload = {
        businessName: document.getElementById('businessName').value,
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        termsVersion: "v1.0"
      };

      try {
        const res = await fetch('/chain-saas/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.error || 'Signup failed');
        
        // Success! Redirect to login
        alert('Account created! Please log in to connect your WhatsApp.');
        window.location.href = '/site/login.html';
      } catch (e) {
        err.textContent = e.message;
        err.style.display = 'block';
        btn.textContent = 'Create Account';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
