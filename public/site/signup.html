<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your account | Chain Innovation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/chain-saas/site/legal.css">
<style>
main{max-width:460px;padding-top:44px}
form{background:#fff;border:1px solid var(--line);border-radius:6px;padding:28px}
label.f{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
input[type=text],input[type=email],input[type=password]{width:100%;padding:11px 12px;border:1px solid #cfc8b6;border-radius:4px;font:inherit;margin-bottom:16px}
input:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.55;margin:4px 0 18px;padding:14px;background:#faf7f0;border:1px solid var(--line);border-radius:4px}
.consent input{margin-top:4px;flex:none;width:18px;height:18px;accent-color:var(--forest)}
button{width:100%;padding:13px;border:0;border-radius:4px;background:var(--forest);color:#fff;font:500 12px "Poppins",sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.err{display:none;background:#f6e1e0;color:#9b2c2c;border:1px solid #e7bcb9;border-radius:4px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.alt{text-align:center;color:var(--muted);font-size:14px;margin-top:18px}
</style>
</head>
<body>
<header><div><a class="logo" href="/">Chain Innovation</a><nav><a href="/chain-saas/site/login.html">Log in</a></nav></div></header>
<main>
<h1>Create your account</h1>
<p class="meta">Set up your WhatsApp assistant in minutes.</p>
<form id="f" novalidate>
  <div class="err" id="err" role="alert"></div>
  <label class="f" for="biz">Business name</label><input id="biz" type="text" maxlength="150" autocomplete="organization" required>
  <label class="f" for="name">Your name</label><input id="name" type="text" maxlength="150" autocomplete="name" required>
  <label class="f" for="email">Email</label><input id="email" type="email" autocomplete="email" required>
  <label class="f" for="pw">Password (8 characters or more)</label><input id="pw" type="password" minlength="8" autocomplete="new-password" required>
  <label class="consent"><input type="checkbox" id="ok">
    <span>I have read and agree to the <a href="/chain-saas/site/terms.html" target="_blank" rel="noopener">Terms of Service</a> and the <a href="/chain-saas/site/privacy.html" target="_blank" rel="noopener">Privacy Policy</a>. I understand that Chain will process my business's data and my customers' WhatsApp messages (names, phone numbers, messages, photos and files) on my behalf, and send message text to Google's Gemini AI to write replies, only to provide the service to my business. I will have the consent or lawful basis I need from my own customers.</span></label>
  <button id="go" type="submit">Create account</button>
</form>
<p class="alt">Already have an account? <a href="/chain-saas/site/login.html">Log in</a></p>
</main>
<script>
var TERMS_VERSION = "2026-11-24"; // keep in step with the version on the legal pages and in routes/auth.js
var f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
function say(m) { err.textContent = m; err.style.display = m ? "block" : "none"; }
f.addEventListener("submit", function (e) {
  e.preventDefault(); say("");
  var v = function (id) { return document.getElementById(id).value.trim(); };
  if (!v("biz") || !v("name") || !v("email") || !document.getElementById("pw").value) return say("Please fill in every field.");
  if (document.getElementById("pw").value.length < 8) return say("Your password needs at least 8 characters.");
  if (!document.getElementById("ok").checked) return say("Please tick the box to confirm you have read and agree to the terms and understand how data is used.");
  go.disabled = true; go.textContent = "Creating…";
  fetch("/chain-saas/api/auth/signup", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ businessName: v("biz"), name: v("name"), email: v("email"), password: document.getElementById("pw").value, acceptTerms: true, termsVersion: TERMS_VERSION })
  }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); }).then(function (r) {
    if (!r.ok) throw new Error(r.d.error || "Could not create the account.");
    location.href = "/chain-saas/site/login.html?created=1";
  }).catch(function (x) { say(x.message); go.disabled = false; go.textContent = "Create account"; });
});
</script>
</body>
</html>
