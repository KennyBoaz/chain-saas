<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Chain SaaS</title>
  <link rel="manifest" href="/chain-saas/site/manifest.json">
  <meta name="theme-color" content="#243b32">
  <link rel="stylesheet" href="/chain-saas/site/style.css">
  <style>
    .dash-container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    .panel { background: #fff; padding: 30px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,.05); border-left: 4px solid var(--gold); }
    .status-badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
    .status-pending { background: #fff3cd; color: #856404; }
    .status-active { background: #d4edda; color: #155724; }
    .status-read_only { background: #f8d7da; color: #721c24; }
    .flex-row { display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <nav>
    <div class="logo">Chain SaaS</div>
    <div class="links">
      <span id="nav-user" style="margin-right: 20px; font-size: 14px; color: var(--muted);"></span>
      <button onclick="logout()" class="btn" style="background: #eee; color: #333;">Log Out</button>
    </div>
  </nav>

  <div class="dash-container">
    <h1 style="margin-bottom: 20px;">Welcome, <span id="biz-name"></span></h1>

    <!-- Billing / Subscription Panel -->
    <div class="panel" id="billing-panel">
      <div class="flex-row">
        <div>
          <h3>Subscription Status</h3>
          <p style="margin-top: 5px;">Status: <span id="tenant-status" class="status-badge"></span></p>
        </div>
        <button class="btn" id="pay-btn" onclick="simulatePayment()">Activate Subscription (Mock)</button>
      </div>
    </div>

    <!-- WhatsApp Connection Panel -->
    <div class="panel">
      <div class="flex-row">
        <div>
          <h3>WhatsApp Connection</h3>
          <p style="margin-top: 5px; color: var(--muted);">Connect your business number to let the AI reply.</p>
          <p style="margin-top: 10px;">Status: <span id="wa-status" style="font-weight: bold;">Checking...</span></p>
        </div>
        <button class="btn" id="wa-btn" onclick="connectWhatsApp()" disabled>Connect WhatsApp</button>
      </div>
    </div>
  </div>

  <!-- Facebook SDK for Embedded Signup -->
  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>

  <script>
    let currentTenant = null;
    let csrf = localStorage.getItem('csrf');

    // 1. Load User Data on page load
    async function loadData() {
      try {
        const res = await fetch('/chain-saas/api/auth/me', { headers: { 'X-CSRF-Token': csrf } });
        if (res.status === 401) return window.location.href = '/site/login.html';
        
        const data = await res.json();
        currentTenant = data.tenant;
        document.getElementById('nav-user').textContent = data.user.email;
        document.getElementById('biz-name').textContent = currentTenant.name;
        
        // Update UI based on status
        const statusEl = document.getElementById('tenant-status');
        statusEl.textContent = currentTenant.status;
        statusEl.className = 'status-badge status-' + currentTenant.status;

        // If active, enable WhatsApp button
        if (currentTenant.status === 'active') {
          document.getElementById('pay-btn').style.display = 'none';
          
          // Check WhatsApp status
          const waRes = await fetch('/chain-saas/api/whatsapp/status', { headers: { 'X-CSRF-Token': csrf } });
          const waData = await waRes.json();
          if (waData.connected) {
            document.getElementById('wa-status').textContent = 'Connected (ID: ' + waData.connection.phone_number_id + ')';
            document.getElementById('wa-status').style.color = 'green';
            document.getElementById('wa-btn').style.display = 'none';
          } else {
            document.getElementById('wa-status').textContent = 'Not connected';
            document.getElementById('wa-status').style.color = 'red';
            document.getElementById('wa-btn').disabled = false;
          }
        } else {
          document.getElementById('wa-btn').disabled = true;
          document.getElementById('wa-status').textContent = 'Requires active subscription';
        }
      } catch (e) {
        console.error(e);
        alert("Error loading dashboard.");
      }
    }

    // 2. Simulate Payment
    async function simulatePayment() {
      const btn = document.getElementById('pay-btn');
      btn.textContent = 'Processing...';
      
      const res = await fetch('/chain-saas/api/billing/checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf },
        body: JSON.stringify({ planId: 1 })
      });
      
      if (res.ok) {
        alert('Payment successful! Subscription active.');
        window.location.reload();
      } else {
        alert('Payment failed.');
        btn.textContent = 'Activate Subscription (Mock)';
      }
    }

    // 3. Embedded WhatsApp Signup (Meta)
    function connectWhatsApp() {
      // Initialize FB SDK
      window.fbAsyncInit = function() {
        FB.init({
          appId: 'YOUR_META_APP_ID', // <- You must insert your Meta App ID here
          autoLogAppEvents: true,
          xfbml: true,
          version: 'v20.0'
        });
      };

      // Launch the popup
      FB.login(function(response) {
        if (response.authResponse) {
          // In a real flow, Meta sends a postMessage event with the WABA ID and Phone Number ID.
          // For now, we listen for that event below.
          console.log('FB Login successful', response);
        } else {
          console.log('User cancelled login or did not fully authorize.');
        }
      }, {
        config_id: 'YOUR_META_CONFIG_ID', // <- You must insert your Meta Config ID here
        response_type: 'code',
        override_default_response_type: true,
        extras: { setup: {}, featureType: 'whatsapp_business_app_onboarding' }
      });
    }

    // 4. Listen for Meta's Embedded Signup success message
    window.addEventListener('message', async (event) => {
      if (!event.origin.endsWith('facebook.com')) return;
      
      try {
        const data = JSON.parse(event.data);
        if (data.type === 'WA_EMBEDDED_SIGNUP' && data.event === 'FINISH') {
          const { waba_id, phone_number_id } = data.data;
          
          // Get the auth code from the FB SDK response
          FB.getLoginStatus(async (response) => {
            if (response.authResponse && response.authResponse.code) {
              const code = response.authResponse.code;
              
              // Send to our backend
              const res = await fetch('/chain-saas/api/whatsapp/connect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf },
                body: JSON.stringify({ code, wabaId: waba_id, phoneNumberId: phone_number_id })
              });
              
              if (res.ok) {
                alert('WhatsApp Connected Successfully!');
                window.location.reload();
              } else {
                alert('Failed to connect WhatsApp.');
              }
            }
          });
        }
      } catch (e) { /* Ignore parsing errors */ }
    });

    // Logout
    async function logout() {
      await fetch('/chain-saas/api/auth/logout', { method: 'POST', headers: { 'X-CSRF-Token': csrf } });
      localStorage.removeItem('csrf');
      window.location.href = '/site/index.html';
    }

    // --- PWA Service Worker Registration ---
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/chain-saas/site/sw.js').then(() => {
        console.log('Service Worker Registered');
      });
    }

    // --- Offline Queue Logic ---
    function saveOfflineMessage(messagePayload) {
      let queue = JSON.parse(localStorage.getItem('offline_msgs') || '[]');
      queue.push(messagePayload);
      localStorage.setItem('offline_msgs', JSON.stringify(queue));
    }

    async function syncOfflineMessages() {
      const queue = JSON.parse(localStorage.getItem('offline_msgs') || '[]');
      if (queue.length === 0) return;

      console.log(`Syncing ${queue.length} offline messages...`);
      const remaining = [];

      for (const msg of queue) {
        try {
          const res = await fetch('/chain-saas/api/whatsapp/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf },
            body: JSON.stringify(msg)
          });
          if (!res.ok) remaining.push(msg); // Keep in queue if failed
        } catch (e) {
          remaining.push(msg); // Keep in queue if network error
        }
      }

      localStorage.setItem('offline_msgs', JSON.stringify(remaining));
      if (remaining.length === 0) alert('All offline messages synced successfully!');
    }

    // Listen for connection restoration
    window.addEventListener('online', syncOfflineMessages);


    // Run on load
    loadData();
  </script>
</body>
</html>
