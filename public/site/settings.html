<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — Chain SaaS</title>
  <link rel="stylesheet" href="/chain-saas/site/style.css">
  <style>
    .dash-container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .panel { background: #fff; padding: 30px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,.05); }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 14px; }
    input, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; }
    .flex-row { display: flex; gap: 20px; }
  </style>
</head>
<body>
  <nav>
    <div class="logo">Chain SaaS</div>
    <div class="links">
      <a href="/chain-saas/site/dashboard.html">Dashboard</a>
      <a href="/chain-saas/site/inbox.html" style="margin-left: 15px;">Inbox</a>
      <button onclick="logout()" class="btn" style="background: #eee; color: #333; margin-left: 20px;">Log Out</button>
    </div>
  </nav>

  <div class="dash-container">
    <h1>Tenant Settings</h1>
    <p style="color:var(--muted); margin-bottom: 30px;">Customize your AI and your brand.</p>

    <div class="panel">
      <h3>AI System Prompt</h3>
      <p style="font-size: 14px; color: var(--muted); margin-bottom: 15px;">Tell the AI how to behave. Include your business name, tone, products, and rules.</p>
      <div class="form-group">
        <textarea id="systemPrompt" rows="6" placeholder="You are a helpful assistant for Kadosh Energies. We sell solar panels..."></textarea>
      </div>
      <button class="btn" onclick="savePrompt()">Save AI Prompt</button>
    </div>

    <div class="panel">
      <h3>Branding</h3>
      <div class="flex-row">
        <div class="form-group" style="flex: 1;">
          <label>Primary Color</label>
          <input type="color" id="primaryColor" style="height: 50px; padding: 5px;">
        </div>
        <div class="form-group" style="flex: 1;">
          <label>Secondary Color</label>
          <input type="color" id="secondaryColor" style="height: 50px; padding: 5px;">
        </div>
      </div>
      <div class="form-group">
        <label>Slogan</label>
        <input type="text" id="slogan" placeholder="e.g. Powering Uganda's Future">
      </div>
      <button class="btn" onclick="saveBranding()">Save Branding</button>
    </div>
  </div>

  <script>
    let csrf = localStorage.getItem('csrf');

    async function loadSettings() {
      const res = await fetch('/chain-saas/api/tenant/me', { headers: { 'X-CSRF-Token': csrf } });
      if (!res.ok) return window.location.href = '/chain-saas/site/login.html';
      
      const { tenant } = await res.json();
      document.getElementById('systemPrompt').value = tenant.system_prompt || '';
      
      const brand = tenant.branding_json || {};
      if (brand.primaryColor) document.getElementById('primaryColor').value = brand.primaryColor;
      if (brand.secondaryColor) document.getElementById('secondaryColor').value = brand.secondaryColor;
      if (brand.slogan) document.getElementById('slogan').value = brand.slogan;
    }

    async function savePrompt() {
      const prompt = document.getElementById('systemPrompt').value;
      const res = await fetch('/chain-saas/api/tenant/profile', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf },
        body: JSON.stringify({ systemPrompt: prompt })
      });
      if (res.ok) {
        alert('AI Prompt Saved!');
      } else {
        const err = await res.json();
        alert('Failed: ' + (err.error || 'Unknown error'));
      }
    }

    async function saveBranding() {
      const payload = {
        primaryColor: document.getElementById('primaryColor').value,
        secondaryColor: document.getElementById('secondaryColor').value,
        slogan: document.getElementById('slogan').value
      };
      
      await fetch('/chain-saas/api/tenant/branding', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf },
        body: JSON.stringify(payload)
      });
      alert('Branding Saved!');
    }

    async function logout() {
      await fetch('/chain-saas/api/auth/logout', { method: 'POST', headers: { 'X-CSRF-Token': csrf } });
      localStorage.removeItem('csrf');
      window.location.href = '/chain-saas/site/index.html';
    }

    loadSettings();
  </script>
</body>
</html>
