<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inbox — Chain SaaS</title>
  <link rel="stylesheet" href="/chain-saas/site/style.css">
  <style>
    body { overflow: hidden; height: 100vh; }
    .layout { display: flex; height: calc(100vh - 65px); }
    
    /* Sidebar */
    .sidebar { width: 340px; background: #fff; border-right: 1px solid #ddd; overflow-y: auto; display: flex; flex-direction: column; }
    .sidebar-header { padding: 15px 20px; border-bottom: 1px solid #eee; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .chat-item { padding: 15px 20px; border-bottom: 1px solid #f5f5f5; cursor: pointer; transition: 0.2s; }
    .chat-item:hover, .chat-item.active { background: #f9f9f9; border-left: 3px solid var(--primary); }
    .chat-item h4 { margin-bottom: 4px; font-size: 15px; color: #111; }
    .chat-item p { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    /* Chat Area */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: #efe8da; position: relative; }
    .chat-header { background: #fff; padding: 15px 20px; border-bottom: 1px solid #ddd; font-weight: 600; box-shadow: 0 2px 5px rgba(0,0,0,.02); z-index: 10; }
    .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    
    .msg { max-width: 75%; padding: 10px 15px; border-radius: 8px; font-size: 14px; line-height: 1.4; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
    .msg.in { align-self: flex-start; background: #fff; border-top-left-radius: 0; }
    .msg.out { align-self: flex-end; background: #d9f2cc; border-top-right-radius: 0; }
    .msg.bot { align-self: flex-end; background: #f4ecd2; border-top-right-radius: 0; }
    
    .composer { background: #f0f0f0; padding: 15px 20px; display: flex; gap: 10px; border-top: 1px solid #ddd; }
    .composer input { flex: 1; padding: 12px 20px; border: 1px solid #ccc; border-radius: 30px; font-size: 14px; outline: none; transition: 0.2s; }
    .composer input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(36, 59, 50, 0.1); }
    
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--muted); }
    .empty-state h2 { color: #333; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div id="toast-container"></div>

  <!-- Global Navigation -->
  <nav class="nav-bar">
    <div class="nav-brand">Chain SaaS</div>
    <div class="nav-links">
      <a href="/chain-saas/site/dashboard.html" class="nav-link">Dashboard</a>
      <a href="/chain-saas/site/inbox.html" class="nav-link active">Inbox</a>
      <a href="/chain-saas/site/settings.html" class="nav-link">Settings</a>
      <button onclick="logout()" class="btn" style="background: #f0f0f0; color: #333; margin-left: 15px; padding: 8px 16px;">Log Out</button>
    </div>
  </nav>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-header">
        <span>Conversations</span>
        <button class="btn" onclick="seedDemo()" style="font-size:11px; padding: 4px 8px; background:#eee; color:#333;">+ Seed Demo</button>
      </div>
      <div id="chat-list" style="flex:1; overflow-y:auto;">
        <!-- Chats load here -->
      </div>
    </div>
    
    <div class="chat-area">
      <div id="chat-empty" class="empty-state">
        <h2>Your Inbox is clear</h2>
        <p>Click "Seed Demo" to generate fake data and test the UI.</p>
      </div>
      
      <div id="chat-box" style="display:none; flex-direction:column; height:100%;">
        <div class="chat-header" id="chat-header"></div>
        <div class="messages" id="messages"></div>
        <div class="composer">
          <input type="text" id="reply-input" placeholder="Type a reply and press Enter..." onkeypress="if(event.key==='Enter') sendReply()">
          <button class="btn" onclick="sendReply()" style="background: var(--primary); color:#fff; border-radius:30px; padding: 0 25px;">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let csrf = localStorage.getItem('csrf');
    let currentPhone = null;

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<span>${type === 'success' ? '✓' : '✕'}</span> ${message}`;
      container.appendChild(toast);
      setTimeout(() => { toast.classList.add('hiding'); setTimeout(() => toast.remove(), 300); }, 3000);
    }

    async function loadChats() {
      const res = await fetch('/chain-saas/api/chats/conversations', { headers: { 'X-CSRF-Token': csrf } });
      if (!res.ok) return window.location.href = '/chain-saas/site/login.html';
      
      const { conversations } = await res.json();
      const list = document.getElementById('chat-list');
      list.innerHTML = '';
      
      if (conversations.length === 0) {
        list.innerHTML = '<p style="padding:20px; color:#888; text-align:center;">No messages yet.</p>';
        return;
      }

      conversations.forEach(c => {
        list.innerHTML += `
          <div class="chat-item" onclick="openChat('${c.phone}', this)">
            <h4>+${c.phone}</h4>
            <p>${c.last_message_preview || 'No messages'}</p>
          </div>
        `;
      });
    }

    async function openChat(phone, el) {
      currentPhone = phone;
      
      // Highlight active chat
      document.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
      if (el) el.classList.add('active');

      document.getElementById('chat-empty').style.display = 'none';
      document.getElementById('chat-box').style.display = 'flex';
      document.getElementById('chat-header').textContent = '+' + phone;

      const res = await fetch('/chain-saas/api/chats/conversations/' + phone + '/messages', { headers: { 'X-CSRF-Token': csrf } });
      const { messages } = await res.json();
      
      const msgArea = document.getElementById('messages');
      msgArea.innerHTML = '';
      
      messages.forEach(m => {
        let senderClass = m.sender_type === 'customer' ? 'in' : (m.sender_type === 'bot' ? 'out bot' : 'out');
        msgArea.innerHTML += `
          <div class="msg ${senderClass}">
            ${m.body}
          </div>
        `;
      });
      msgArea.scrollTop = msgArea.scrollHeight;
    }

    async function sendReply() {
      if (!currentPhone) return;
      const input = document.getElementById('reply-input');
      const text = input.value.trim();
      if (!text) return;

      input.value = ''; // Clear immediately for better UX
      
      const res = await fetch('/chain-saas/api/chats/conversations/' + currentPhone + '/reply', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf },
        body: JSON.stringify({ text })
      });

      if (res.ok) {
        openChat(currentPhone); // Reload thread
      } else {
        showToast('Failed to send message.', 'error');
        input.value = text; // Restore text on failure
      }
    }

    async function seedDemo() {
      showToast('Generating demo data...', 'success');
      const res = await fetch('/chain-saas/api/chats/seed-demo', {
        method: 'POST',
        headers: { 'X-CSRF-Token': csrf }
      });
      if (res.ok) {
        showToast('Demo data generated!');
        loadChats();
      }
    }

    async function logout() {
      await fetch('/chain-saas/api/auth/logout', { method: 'POST', headers: { 'X-CSRF-Token': csrf } });
      localStorage.removeItem('csrf');
      window.location.href = '/chain-saas/site/index.html';
    }

    loadChats();
    setInterval(loadChats, 10000); // Light polling
  </script>
</body>
</html>
